[package]
name = "matalas_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "matalas_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
